<style id="stil">
  :root{--blau:#1565C0;--blau-dunkel:#0D3E6A;--blau-hell:#E3EEF9;--gruen:#1B7F3B;--gruen-hell:#E3F4E8;--rot:#C62828;--text:#22303C;--grau:#5A6A7A;--linie:#D6E0EA;--seite:#EEF3F8;--karte:#fff}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--text);background:var(--seite);-webkit-text-size-adjust:100%}
  header{background:linear-gradient(180deg,#3f63dd,#182f83);border-bottom:3px solid #42A5F5;color:#fff;box-shadow:0 3px 12px rgba(24,47,131,.35)}
  .kopf{max-width:760px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:12px}
  .kopf svg{width:46px;height:46px;flex:none;filter:drop-shadow(0 2px 4px rgba(8,42,74,.35))}
  .kopf .titel{flex:1;min-width:0}
  h1{font-size:20px;margin:0;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kopf .unter{color:#D6E8F7}
  main{max-width:760px;margin:0 auto;padding:14px 12px 40px}
  .unter{color:var(--grau);font-size:13.5px;margin-top:2px}
  button{font:inherit;border:1px solid #0F57A8;background:linear-gradient(180deg,#2A7BD6 0%,var(--blau) 55%,#115AAE 100%);color:#fff;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button:active:not(:disabled){filter:brightness(.92)}
  button.leise{background:linear-gradient(180deg,#FFFFFF 0%,#EEF4FB 100%);color:var(--blau);border-color:#9DBBE0}
  button.klein{padding:6px 11px;font-size:14px;min-height:36px}
  button.rot{border-color:#9E1C1C;background:var(--rot)}
  header button.leise{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.45)}
  button:disabled{opacity:.5;cursor:default}
  .karte{background:var(--karte);border:1px solid var(--linie);border-radius:14px;padding:14px;margin-bottom:12px}
  .zahlen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .zahl{text-align:center;padding:4px}
  .zahl b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
  .zahl span{font-size:12.5px;color:var(--grau)}
  .zahl.rest b{color:var(--blau)} .zahl.bez b{color:var(--gruen)}
  .balken{height:14px;background:var(--blau-hell);border-radius:8px;overflow:hidden;margin:12px 0 6px}
  .balken div{height:100%;background:linear-gradient(90deg,#2E9B52,var(--gruen));border-radius:8px;transition:width .4s}
  .zahl.rest b{color:var(--blau-dunkel)}
  .info{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--grau)}
  h2{font-size:15px;margin:0 0 10px}
  form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{display:block;font-size:12.5px;color:var(--grau);margin-bottom:3px}
  input,select{font:inherit;font-size:17px;width:100%;min-height:46px;padding:9px 11px;border:1px solid var(--linie);border-radius:10px;background:#fff;color:var(--text)}
  .feld-mit{display:flex;gap:8px}
  .feld-mit input{flex:1;min-width:0}
  .feld-mit button{flex:none;min-width:64px;padding:8px 12px}
  #f-plus{font-weight:700;min-width:84px}
  input:focus,select:focus{outline:2px solid var(--blau);outline-offset:-1px}
  .voll{grid-column:1/-1}
  .knopfreihe{display:flex;gap:8px;justify-content:flex-end;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:12px;color:var(--grau);font-weight:600;text-align:left;padding:6px 6px;border-bottom:1px solid var(--linie)}
  td{padding:8px 6px;border-bottom:1px solid var(--linie);vertical-align:top}
  td.b,th.b{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.betrag{color:var(--gruen);font-weight:600}
  td .notiz{color:var(--grau);font-size:12.5px}
  tr:last-child td{border-bottom:none}
  .leer{color:var(--grau);text-align:center;padding:18px 0}
  svg{display:block;width:100%;height:auto}
  .hinweis{font-size:13px;padding:9px 12px;border-radius:10px;margin-bottom:12px}
  .hinweis.warn{background:#FFF6DD;color:#7A5500}
  .hinweis.ok{background:var(--gruen-hell);color:var(--gruen)}
  .dialog{position:fixed;inset:0;background:rgba(15,25,40,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
  .dialog[hidden]{display:none}
  [hidden]{display:none !important}
  details#import{margin-top:14px;border-top:1px solid var(--linie);padding-top:12px}
  details#import summary{cursor:pointer;color:var(--blau);font-weight:600;font-size:15px;padding:6px 0}
  textarea{font:16px/1.5 ui-monospace,Consolas,monospace;width:100%;padding:10px;border:1px solid var(--linie);border-radius:10px;background:#fff;color:var(--text);resize:vertical}
  .i-zus{font-size:14px;margin:10px 0 6px}
  #i-vorschau table{font-size:13.5px}
  #i-vorschau tr.fehler td{color:var(--rot)} #i-vorschau tr.doppelt td{color:var(--grau);text-decoration:line-through}
  .dialog .karte{max-width:420px;width:100%;margin:0}
  .fuss{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--grau)}
  @media (max-width:520px){
    .zahl b{font-size:18px}
    form{grid-template-columns:1fr}
    .nur-breit{display:none}
    .knopfreihe button[type=submit]{flex:1}
    td{padding:10px 4px}
  }
</style>
</head>
<body>
<template id="geruest">
<header><div class="kopf">
  <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="ig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f63dd"/><stop offset="1" stop-color="#182f83"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="14" fill="url(#ig)" stroke="#42A5F5" stroke-width="2.5"/><circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="6"/><path d="M32 13 A19 19 0 1 1 13.9 37.9" fill="none" stroke="#7CD992" stroke-width="6" stroke-linecap="round"/><text x="32" y="37" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-weight="800" font-size="14" fill="#fff">CHF</text></svg>
  <div class="titel"><h1 id="titel"></h1><div class="unter" id="untertitel"></div></div>
  <button class="leise klein" id="btn-einst">Einstellungen</button>
</div></header>
<main>
  <div id="meldung"></div>
  <section class="karte" id="anmelden" hidden>
    <h2>Code eingeben</h2>
    <form id="form-code" style="grid-template-columns:1fr">
      <div class="feld-mit"><input id="c-code" type="password" autocomplete="current-password" placeholder="Code"><button type="submit">Öffnen</button></div>
      <div class="unter">Der Code wird auf diesem Gerät gemerkt.</div>
    </form>
  </section>

  <section class="karte">
    <div class="zahlen">
      <div class="zahl"><b id="z-total"></b><span>Darlehen</span></div>
      <div class="zahl bez"><b id="z-bezahlt"></b><span>zurückbezahlt</span></div>
      <div class="zahl rest"><b id="z-rest"></b><span>noch offen</span></div>
    </div>
    <div class="balken"><div id="balken"></div></div>
    <div class="info"><span id="i-prozent"></span><span id="i-letzte"></span><span id="i-schnitt"></span></div>
  </section>

  <section class="karte" id="erfassen">
    <h2>Zahlung erfassen</h2>
    <form id="form">
      <div><label for="f-datum">Datum</label><div class="feld-mit"><input id="f-datum" type="text" inputmode="decimal" placeholder="TT.MM.JJ" autocomplete="off" required><button type="button" class="leise" id="f-heute">Heute</button></div></div>
      <div><label for="f-betrag">Betrag CHF</label><div class="feld-mit"><input id="f-betrag" type="text" inputmode="decimal" placeholder="0" autocomplete="off" required><button type="button" id="f-plus" title="Jeder Klick 100.– mehr">+100</button><button type="button" class="leise" id="f-null" title="Betrag auf 0">↺</button></div></div>
      <div><label for="f-art">Wie bezahlt</label>
        <select id="f-art"><option>Bank</option><option>TWINT</option><option>Bar</option><option>Anderes</option></select></div>
      <div><label for="f-notiz">Notiz (freiwillig)</label><input id="f-notiz" type="text" maxlength="120" placeholder="z. B. Teilzahlung November"></div>
      <div class="voll knopfreihe"><span id="f-status" class="unter"></span><button type="submit" id="f-knopf">Zahlung speichern</button></div>
    </form>
    <details id="import">
      <summary>Viele alte Zahlungen auf einmal nachtragen</summary>
      <div class="unter" style="margin:8px 0">Eine Zahlung pro Zeile: Datum und Betrag, danach freiwillig Bank/TWINT/Bar und eine Notiz.
        Einfügen aus Notizen, Excel, WhatsApp oder Bankauszug geht auch.</div>
      <textarea id="i-text" rows="7" spellcheck="false" placeholder="03.10.22 500&#10;15.11.22 300 Bar&#10;2.1.2023  1'200.00  Bank  Weihnachtsgeld&#10;20.02.23 Fr. 250.–"></textarea>
      <div class="knopfreihe" style="margin-top:8px"><button type="button" class="leise" id="i-pruefen">Prüfen</button><button type="button" id="i-speichern" disabled>Alle speichern</button></div>
      <div id="i-vorschau"></div>
    </details>
  </section>

  <section class="karte" id="verlauf-karte">
    <h2>Verlauf Restschuld</h2>
    <div id="verlauf"></div>
  </section>

  <section class="karte">
    <h2>Zahlungen</h2>
    <div id="liste"></div>
  </section>

  <div class="fuss">
    <span id="stand"></span>
    <span><button class="leise klein" id="btn-abmelden">Abmelden</button> <button class="leise klein" id="btn-kopieren">Liste kopieren (für Excel)</button></span>
  </div>
</main>

<div class="dialog" id="dlg-einst" hidden>
  <div class="karte">
    <h2>Einstellungen</h2>
    <form id="form-einst">
      <div class="voll"><label for="e-name">Name der Schuldnerin</label><input id="e-name" type="text" maxlength="60"></div>
      <div><label for="e-total">Darlehen CHF</label><input id="e-total" type="text" inputmode="decimal" autocomplete="off" required></div>
      <div><label for="e-seit">Ausbezahlt am (freiwillig)</label><div class="feld-mit"><input id="e-seit" type="text" inputmode="decimal" placeholder="TT.MM.JJ" autocomplete="off"><button type="button" class="leise" id="e-heute">Heute</button></div></div>
      <div class="voll unter">Datum, an dem sie das Geld bekommen hat. Steht oben unter dem Namen, und die Grafik «Verlauf» beginnt dort. Leer lassen geht auch.</div>
      <div class="voll knopfreihe"><button type="button" class="leise" id="e-abbruch">Abbrechen</button><button type="submit">Speichern</button></div>
    </form>
  </div>
</div>

<div class="dialog" id="dlg-loeschen" hidden>
  <div class="karte">
    <h2>Zahlung löschen?</h2>
    <p id="loeschen-text" style="margin:0 0 14px"></p>
    <div class="knopfreihe"><button class="leise" id="l-abbruch">Abbrechen</button><button class="rot" id="l-ok">Löschen</button></div>
  </div>
</div>
</template>

<script type="application/json" id="daten">{"name":"Kollegin","total":20000,"seit":"","zahlungen":[],"geaendert":""}</script>

<script id="app-code">
(() => {
  const $ = (s) => document.getElementById(s);
  const geruest = document.getElementById('geruest');
  let d;
  try { d = JSON.parse($('daten').textContent); } catch (e) { d = { name: 'Kollegin', total: 20000, seit: '', zahlungen: [] }; }
  d.zahlungen = Array.isArray(d.zahlungen) ? d.zahlungen : [];
  document.body.appendChild(geruest.content.cloneNode(true));

  let schreibbar = false;

  // ---------- Format
  const chf = (x) => { const n = Math.round(x * 100) / 100, s = n.toFixed(2).split('.'); return s[0].replace(/\B(?=(\d{3})+(?!\d))/g, '’') + '.' + s[1]; };
  const chfKurz = (x) => (Math.round(x * 100) % 100 === 0 ? chf(x).slice(0, -3) : chf(x));
  const MON = ['Jan.', 'Feb.', 'März', 'Apr.', 'Mai', 'Juni', 'Juli', 'Aug.', 'Sept.', 'Okt.', 'Nov.', 'Dez.'];
  const datum = (iso) => { if (!iso) return ''; const [j, m, t] = iso.split('-').map(Number); return `${t}. ${MON[m - 1]} ${j}`; };
  const datumKurz = (iso) => { const [j, m, t] = iso.split('-'); return `${t}.${m}.${j.slice(2)}`; };
  /** «11.11.26», «3.10.26», «3.10.2026», «3.10» (dieses Jahr), auch mit Komma oder Leerzeichen -> ISO, sonst null */
  const leseDatum = (txt) => {
    const m = String(txt).trim().match(/^(\d{1,2})[.,\/\s-]+(\d{1,2})(?:[.,\/\s-]+(\d{2}|\d{4}))?[.]?$/);
    if (!m) return null;
    const t = +m[1], mo = +m[2], j = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : new Date().getFullYear();
    const dt = new Date(j, mo - 1, t);
    if (dt.getFullYear() !== j || dt.getMonth() !== mo - 1 || dt.getDate() !== t) return null;
    return `${j}-${String(mo).padStart(2, '0')}-${String(t).padStart(2, '0')}`;
  };
  const leseBetrag = (txt) => { const v = parseFloat(String(txt).replace(/['’\s]/g, '').replace(',', '.')); return Math.round(v * 100) / 100; };
  const heute = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`; };
  const tageSeit = (iso) => Math.round((new Date(heute() + 'T12:00') - new Date(iso + 'T12:00')) / 864e5);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sortiert = () => [...d.zahlungen].sort((a, b) => a.datum.localeCompare(b.datum) || a.id.localeCompare(b.id));

  // ---------- Anzeigen
  function zeige() {
    const z = sortiert(), bezahlt = z.reduce((s, x) => s + x.betrag, 0), rest = Math.max(0, d.total - bezahlt);
    const pz = d.total > 0 ? Math.min(100, bezahlt / d.total * 100) : 0;
    document.title = `Darlehen ${d.name} – Rückzahlungen`;
    $('titel').textContent = `Darlehen ${d.name}`;
    $('untertitel').textContent = d.seit ? `Ausbezahlt am ${datumKurz(d.seit)}` : 'Rückzahlungen';
    $('z-total').textContent = chfKurz(d.total);
    $('z-bezahlt').textContent = chfKurz(bezahlt);
    $('z-rest').textContent = chfKurz(rest);
    $('balken').style.width = pz + '%';
    $('i-prozent').textContent = rest <= 0 && z.length ? 'Ganz zurückbezahlt 🎉' : `${pz.toFixed(1).replace('.0', '')} % zurückbezahlt`;
    const letzte = z[z.length - 1];
    if (letzte) {
      const t = tageSeit(letzte.datum);
      $('i-letzte').textContent = `Letzte Zahlung: ${datumKurz(letzte.datum)} (${t <= 0 ? 'heute' : t === 1 ? 'gestern' : `vor ${t} Tagen`})`;
      $('i-schnitt').textContent = `${z.length} Zahlung${z.length === 1 ? '' : 'en'} · Ø ${chfKurz(bezahlt / z.length)}`;
    } else { $('i-letzte').textContent = 'Noch keine Zahlung'; $('i-schnitt').textContent = ''; }

    // Liste: neueste oben, mit Rest nach der Zahlung
    let lauf = d.total;
    const mitRest = z.map((x) => { lauf -= x.betrag; return { ...x, rest: lauf }; }).reverse();
    $('liste').innerHTML = mitRest.length ? `<table><thead><tr><th>Datum</th><th>Wie / Notiz</th><th class="b">Betrag</th><th class="b nur-breit">Rest danach</th><th></th></tr></thead><tbody>${
      mitRest.map((x) => `<tr><td>${datumKurz(x.datum)}</td><td>${esc(x.art)}${x.notiz ? `<div class="notiz">${esc(x.notiz)}</div>` : ''}</td>` +
        `<td class="b betrag">${chf(x.betrag)}</td><td class="b nur-breit">${chf(Math.max(0, x.rest))}</td>` +
        `<td class="b">${schreibbar ? `<button class="leise klein" data-weg="${x.id}" title="Löschen">✕</button>` : ''}</td></tr>`).join('')}</tbody></table>`
      : '<div class="leer">Noch keine Zahlung erfasst.</div>';

    zeichneVerlauf(z);
    $('stand').textContent = d.geaendert ? `Gespeichert: ${new Date(d.geaendert).toLocaleString('de-CH', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}` : '';
    for (const id of ['f-knopf', 'btn-einst']) $(id).disabled = !schreibbar;
  }

  function zeichneVerlauf(z) {
    const box = $('verlauf');
    if (!z.length) { $('verlauf-karte').hidden = true; return; }
    $('verlauf-karte').hidden = false;
    const W = 700, H = 230, L = 70, R = 14, T = 12, B = 30;
    const t0 = new Date((d.seit && d.seit < z[0].datum ? d.seit : z[0].datum) + 'T12:00').getTime();
    const t1 = Math.max(new Date(heute() + 'T12:00').getTime(), t0 + 864e5 * 7);
    const x = (iso) => L + (new Date(iso + 'T12:00').getTime() - t0) / (t1 - t0) * (W - L - R);
    const y = (v) => T + (1 - v / d.total) * (H - T - B);
    let rest = d.total, pfad = `M${x(d.seit && d.seit < z[0].datum ? d.seit : z[0].datum)},${y(d.total)}`, punkte = '';
    for (const p of z) { pfad += ` H${x(p.datum)}`; rest = Math.max(0, rest - p.betrag); pfad += ` V${y(rest)}`; punkte += `<circle cx="${x(p.datum)}" cy="${y(rest)}" r="3.5" fill="#1B7F3B"><title>${datumKurz(p.datum)}: ${chf(p.betrag)} → offen ${chf(rest)}</title></circle>`; }
    pfad += ` H${x(heute())}`;
    const flaeche = pfad + ` V${y(0)} H${L} Z`;
    const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => { const v = d.total * f; return `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#E2E7EE"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="15" fill="#6B7785">${chfKurz(v)}</text>`; }).join('');
    const ersteD = new Date(t0), letzteD = new Date(t1);
    const lab = (dt) => `${dt.getDate()}.${dt.getMonth() + 1}.${String(dt.getFullYear()).slice(2)}`;
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Restschuld über die Zeit">${ticks}
      <path d="${flaeche}" fill="#E3EEF9"/><path d="${pfad}" fill="none" stroke="#1565C0" stroke-width="2.2" stroke-linejoin="round"/>${punkte}
      <text x="${L}" y="${H - 8}" font-size="15" fill="#6B7785">${lab(ersteD)}</text><text x="${W - R}" y="${H - 8}" font-size="15" fill="#6B7785" text-anchor="end">heute ${lab(letzteD)}</text></svg>`;
  }

  function melde(text, artMeldung = 'warn') { $('meldung').innerHTML = text ? `<div class="hinweis ${artMeldung}">${esc(text)}</div>` : ''; }

  // ---------- Speichern über /api/daten (Vercel)
  const CODE_KEY = 'darlehen-code';
  let code = '', rolle = null;
  const merke = (c) => { try { if (c) localStorage.setItem(CODE_KEY, c); else localStorage.removeItem(CODE_KEY); } catch (e) {} };
  const gemerkt = () => { try { return localStorage.getItem(CODE_KEY) || ''; } catch (e) { return ''; } };
  async function api(methode, body) {
    const r = await fetch('/api/daten', { method: methode, headers: { 'x-code': code, ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
    let j = {}; try { j = await r.json(); } catch (e) {}
    return { status: r.status, ...j };
  }
  async function speichere(text) {
    if (rolle !== 'schreiben') { melde('Nur anschauen erlaubt.'); return false; }
    $('f-status').textContent = 'Speichert …';
    try {
      const a = await api('PUT', { daten: d, basis: d.geaendert || '' });
      $('f-status').textContent = '';
      if (a.status === 200) { d = a.daten; zeige(); melde(text, 'ok'); return true; }
      if (a.status === 409) { d = a.daten; zeige(); melde('Inzwischen auf einem anderen Gerät geändert – neuer Stand geladen, bitte nochmals eintragen.'); return 'neu'; }
      if (a.status === 401) { abmelden('Code nicht mehr gültig.'); return false; }
      melde('Speichern ging nicht: ' + (a.fehler || a.status)); return false;
    } catch (e) { $('f-status').textContent = ''; melde('Keine Verbindung – nicht gespeichert.'); return false; }
  }
  async function ladeDaten() {
    let a;
    try { a = await api('GET'); } catch (e) { melde('Keine Verbindung.'); return; }
    if (a.status === 401) return abmelden(code ? 'Code falsch.' : '');
    if (a.status !== 200) { melde('Laden ging nicht: ' + (a.fehler || a.status)); return; }
    rolle = a.rolle; merke(code);
    if (a.daten) d = a.daten;
    schreibbar = rolle === 'schreiben';
    $('anmelden').hidden = true;
    for (const el of document.querySelectorAll('.nach-anmelden')) el.hidden = false;
    for (const id of ['erfassen', 'btn-einst']) $(id).hidden = !schreibbar;
    if (!schreibbar) melde('Nur Ansicht – hier siehst du alle Rückzahlungen.', 'ok');
    else if (!a.daten) melde('Noch nichts gespeichert – die nächste Zahlung speichert alles.', 'warn');
    else melde('');
    zeige();
  }
  function abmelden(text) {
    code = ''; rolle = null; schreibbar = false; merke('');
    $('anmelden').hidden = false;
    for (const id of ['erfassen', 'btn-einst']) $(id).hidden = true;
    for (const el of document.querySelectorAll('.nach-anmelden')) el.hidden = true;
    melde(text || '');
    setTimeout(() => $('c-code').focus(), 50);
  }

  // ---------- Viele Zahlungen auf einmal (Nachtragen)
  /** Eine Zeile lesen: Datum (11.11.26 / 11.11.2026 / 2026-11-11), Betrag (500 / 1'500.00 / 1500,50 / Fr. 250.–), Rest = Art/Notiz. */
  function leseImportZeile(roh) {
    let z = String(roh).replace(/\u00a0/g, ' ').trim();
    if (!z) return null;
    let iso = null;
    let m = z.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) { iso = leseDatum(`${m[3]}.${m[2]}.${m[1]}`); z = z.replace(m[0], ' '); }
    else { m = z.match(/(^|[^\d])(\d{1,2})[.\/](\d{1,2})[.\/](\d{4}|\d{2})(?![\d])/); if (m) { iso = leseDatum(`${m[2]}.${m[3]}.${m[4]}`); z = z.replace(m[0], m[1] + ' '); } }
    if (!iso) return { roh, fehler: 'Datum fehlt oder ungültig' };
    z = z.replace(/\b(CHF|SFr\.?|Fr\.)\s*/gi, ' ');
    const b = z.match(/-?\d{1,3}(?:['’]\d{3})+(?:[.,]\d{1,2})?|-?\d+(?:[.,]\d{1,2})?/);
    if (!b) return { roh, fehler: 'Betrag fehlt' };
    const betrag = leseBetrag(b[0]);
    if (!(betrag > 0)) return { roh, fehler: 'Betrag fehlt' };
    z = (z.slice(0, b.index) + ' ' + z.slice(b.index + b[0].length)).replace(/^[\s.–-]+|[\s]+$/g, '').replace(/^[.–-]+\s*/, '').replace(/\t+/g, ' ').replace(/\s{2,}/g, ' ').trim();
    let art = 'Bank';
    const a = z.match(/\b(Bank|TWINT|Twint|twint|Bar|bar|bank)\b/);
    if (a) { art = /twint/i.test(a[1]) ? 'TWINT' : /bar/i.test(a[1]) ? 'Bar' : 'Bank'; z = z.replace(a[0], '').replace(/\s{2,}/g, ' ').replace(/^[\s,;:–-]+|[\s,;:–-]+$/g, ''); }
    return { roh, datum: iso, betrag, art, notiz: z.slice(0, 120) };
  }
  let importListe = [];
  function pruefeImport() {
    const zeilen = $('i-text').value.split(/\r?\n/);
    const schon = new Set(d.zahlungen.map((x) => `${x.datum}|${x.betrag}`));
    const gesehen = new Set();
    importListe = zeilen.map(leseImportZeile).filter(Boolean).map((x) => {
      if (x.fehler) return x;
      const k = `${x.datum}|${x.betrag}`;
      const doppelt = schon.has(k) ? 'schon erfasst' : gesehen.has(k) ? 'doppelt in der Liste' : '';
      gesehen.add(k);
      return { ...x, doppelt };
    });
    const neu = importListe.filter((x) => !x.fehler && !x.doppelt), fehler = importListe.filter((x) => x.fehler).length, dop = importListe.filter((x) => x.doppelt).length;
    const summe = neu.reduce((s2, x) => s2 + x.betrag, 0);
    $('i-vorschau').innerHTML = importListe.length ? `<div class="i-zus"><b>${neu.length} Zahlung${neu.length === 1 ? '' : 'en'}</b> · zusammen <b>${chf(summe)}</b>` +
      `${fehler ? ` · <span style="color:var(--rot)">${fehler} Zeile${fehler === 1 ? '' : 'n'} nicht lesbar</span>` : ''}${dop ? ` · ${dop} doppelt (werden weggelassen)` : ''}</div>` +
      `<table><thead><tr><th>Datum</th><th>Wie / Notiz</th><th class="b">Betrag</th></tr></thead><tbody>${importListe.map((x) => x.fehler
        ? `<tr class="fehler"><td colspan="2">${esc(x.roh)}</td><td class="b">${esc(x.fehler)}</td></tr>`
        : `<tr class="${x.doppelt ? 'doppelt' : ''}" title="${esc(x.doppelt)}"><td>${datumKurz(x.datum)}</td><td>${esc(x.art)}${x.notiz ? `<div class="notiz">${esc(x.notiz)}</div>` : ''}${x.doppelt ? `<div class="notiz">${esc(x.doppelt)}</div>` : ''}</td><td class="b betrag">${chf(x.betrag)}</td></tr>`).join('')}</tbody></table>` : '';
    $('i-speichern').disabled = !neu.length || !schreibbar;
    $('i-speichern').textContent = neu.length ? `${neu.length} speichern` : 'Alle speichern';
  }
  $('i-pruefen').onclick = pruefeImport;
  $('i-text').addEventListener('input', () => { $('i-speichern').disabled = true; });
  $('i-speichern').onclick = async () => {
    pruefeImport();
    const neu = importListe.filter((x) => !x.fehler && !x.doppelt);
    if (!neu.length) return;
    const basis = Date.now();
    const vorher = d.zahlungen;
    d.zahlungen = [...d.zahlungen, ...neu.map((x, i) => ({ id: (basis + i).toString(36), datum: x.datum, betrag: x.betrag, art: x.art, notiz: x.notiz }))];
    zeige();
    const ok = await speichere(`${neu.length} Zahlungen nachgetragen (zusammen ${chf(neu.reduce((s2, x) => s2 + x.betrag, 0))}).`);
    if (ok === true) { $('i-text').value = ''; $('i-vorschau').innerHTML = ''; $('i-speichern').disabled = true; $('import').open = false; window.scrollTo({ top: 0, behavior: 'smooth' }); }
    else if (!ok) { d.zahlungen = vorher; zeige(); }
  };

  // ---------- Bedienung
  const heuteKurz = () => datumKurz(heute());
  $('f-datum').value = heuteKurz();
  $('f-heute').onclick = () => { $('f-datum').value = heuteKurz(); };
  $('e-heute').onclick = () => { $('e-seit').value = heuteKurz(); };
  for (const id of ['f-datum', 'f-betrag', 'e-seit']) $(id).addEventListener('focus', (ev) => setTimeout(() => ev.target.select(), 0));
  $('f-plus').onclick = () => { const v = leseBetrag($('f-betrag').value); $('f-betrag').value = String((v > 0 ? v : 0) + 100); };
  $('f-null').onclick = () => { $('f-betrag').value = ''; };
  $('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const betrag = leseBetrag($('f-betrag').value);
    if (!(betrag > 0)) { melde('Bitte einen Betrag eingeben (oder +100 tippen).'); return; }
    const iso = leseDatum($('f-datum').value);
    if (!iso) { melde('Datum bitte so: 11.11.26'); return; }
    const z = { id: Date.now().toString(36), datum: iso, betrag, art: $('f-art').value, notiz: $('f-notiz').value.trim() };
    d.zahlungen.push(z);
    zeige();
    const ok = await speichere(`${chf(betrag)} vom ${datumKurz(z.datum)} gespeichert.`); if (ok === true) { $('f-betrag').value = ''; $('f-notiz').value = ''; } else if (!ok) { d.zahlungen = d.zahlungen.filter((x) => x !== z); zeige(); }
  });
  let wegId = null;
  $('liste').addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-weg]'); if (!b) return;
    const z = d.zahlungen.find((x) => x.id === b.dataset.weg); if (!z) return;
    wegId = z.id; $('loeschen-text').textContent = `${chf(z.betrag)} vom ${datumKurz(z.datum)} (${z.art}) wirklich löschen?`; $('dlg-loeschen').hidden = false;
  });
  $('l-abbruch').onclick = () => { $('dlg-loeschen').hidden = true; };
  $('l-ok').onclick = async () => {
    $('dlg-loeschen').hidden = true;
    const vorher = d.zahlungen; d.zahlungen = d.zahlungen.filter((x) => x.id !== wegId); zeige();
    const ok = await speichere('Zahlung gelöscht.'); if (!ok) { d.zahlungen = vorher; zeige(); }
  };
  $('btn-einst').onclick = () => { $('e-name').value = d.name; $('e-total').value = d.total; $('e-seit').value = d.seit ? datumKurz(d.seit) : ''; $('dlg-einst').hidden = false; };
  $('e-abbruch').onclick = () => { $('dlg-einst').hidden = true; };
  $('form-einst').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const total = leseBetrag($('e-total').value); if (!(total > 0)) return;
    const vorher = { ...d };
    const seitTxt = $('e-seit').value.trim(), seit = seitTxt ? leseDatum(seitTxt) : '';
    if (seit === null) { melde('Datum bitte so: 11.11.26'); return; }
    d.name = $('e-name').value.trim() || 'Kollegin'; d.total = total; d.seit = seit;
    $('dlg-einst').hidden = true; zeige();
    const ok = await speichere('Einstellungen gespeichert.'); if (!ok) { Object.assign(d, vorher); zeige(); }
  });
  $('btn-kopieren').onclick = async () => {
    let rest = d.total;
    const zeilen = [['Datum', 'Betrag CHF', 'Wie', 'Notiz', 'Rest CHF'].join('\t'), ...sortiert().map((x) => { rest -= x.betrag; return [datumKurz(x.datum), x.betrag.toFixed(2), x.art, x.notiz, Math.max(0, rest).toFixed(2)].join('\t'); })];
    try { await navigator.clipboard.writeText(zeilen.join('\n')); $('btn-kopieren').textContent = 'Kopiert ✓'; setTimeout(() => { $('btn-kopieren').textContent = 'Liste kopieren (für Excel)'; }, 2000); }
    catch (e) { melde('Kopieren wurde vom Browser abgelehnt.'); }
  };

  $('form-code').addEventListener('submit', (ev) => { ev.preventDefault(); code = $('c-code').value.trim(); if (code) ladeDaten(); });
  $('btn-abmelden').onclick = () => abmelden('Abgemeldet.');
  document.addEventListener('visibilitychange', () => { if (!document.hidden && rolle) ladeDaten(); });   // wieder geöffnet: neuster Stand

  // ---------- Start: Code aus dem Link (…/#code) oder auf diesem Gerät gemerkt
  for (const el of document.querySelectorAll('main > section.karte:not(#anmelden), main > .fuss')) el.classList.add('nach-anmelden');
  const ausLink = decodeURIComponent((location.hash || '').slice(1));
  if (ausLink) { code = ausLink; history.replaceState(null, '', location.pathname); } else code = gemerkt();
  for (const el of document.querySelectorAll('.nach-anmelden')) el.hidden = true;
  $('btn-einst').hidden = true;
  zeige();
  if (code) ladeDaten(); else abmelden('');
})();
</script>
</body>
</html>
